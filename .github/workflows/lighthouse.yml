name: Lighthouse

# Audits the prerendered pages on every push. Accessibility, best practices
# and SEO below the thresholds in lighthouserc.json fail the run; a
# performance dip only warns, because CI machines vary run to run.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse · audit built pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Serves dist/, runs Lighthouse 3 times per page, checks the median
      # against lighthouserc.json, and prints links to the full reports.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.16.0 autorun

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
